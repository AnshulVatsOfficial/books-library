services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: books-library-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - MONGODB_URI=mongodb://mongodb:27017/books-library
      - JWT_SECRET_KEY=local_docker_secret_key_12345
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - books-network

  mongodb:
    image: mongo:7.0
    container_name: books-library-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - books-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongodb_data:
    driver: local

networks:
  books-network:
    driver: bridge
